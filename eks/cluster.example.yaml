apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: your-hello-world-cluster
  region: YOUR_AWS_REGION
  version: "1.36"

managedNodeGroups:
  - name: hello-world-workers
    instanceType: t3.medium
    desiredCapacity: 0
    minSize: 0
    maxSize: 3
    volumeSize: 20
    labels:
      role: worker
